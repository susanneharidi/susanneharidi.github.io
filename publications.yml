# Publications, preprints, talks and posters
# -------------------------------------------------------------------
# Every entry starts with "- type:". To add one, copy a similar block,
# paste it anywhere in this file and edit the values. Order does not
# matter: each section on the site is sorted by date (newest first).
#
# Required fields
#   type:      journal | preprint | conference
#   date:      YYYY-MM-DD (publication date, or first day of the conference)
#   title:     "..."
#   authors:   "Last, F.; Last, F. M.; ..."  (separate authors with ";")
#              Add * directly after a name for equal contribution: "Haridi, S.*"
#   venue:     journal / conference name (shown in italics)
#
# Optional fields (a button only appears when the field is filled in)
#   details:          volume(issue), pages, or conference location
#   kind:             Poster | Talk | GAC (co-organizer) ...  (conference entries)
#   selected:         true  -> also shown on the home page
#   pdf:              link to a legal full-text PDF
#   preprint:         link to a preprint
#   preprint-label:   text for the preprint button (default "Preprint")
#   abstract:         link to a published conference abstract
#   poster:           files/posters/<file>.pdf  (upload the PDF to files/posters/)
#   slides:           link or files/slides/<file>.pdf
#   code:             link to the code repository
#   video:            link to a video
#   preregistration:  one link, or a list of links (numbered buttons)
#   website:          any other web page
#   doi:              10.xxxx/...  (without https://doi.org/)
#   note:             short extra remark shown under the entry
# -------------------------------------------------------------------


